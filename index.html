<div class="card">
    <h2>📊 Dashboard Stats</h2>
    <p>Total Products: <span id="totalProducts"></span></p>
    <p>Total Sales: <span id="totalSales"></span></p>
    <button onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button>
</div>

<div class="card">
    <h2>➕ Add Product</h2>
    <input type="number" id="newId" placeholder="Product ID">
    <input type="text" id="newName" placeholder="Product Name">
    <input type="number" id="newQty" placeholder="Quantity">
    <button onclick="addProduct()">Add Product</button>
</div>
